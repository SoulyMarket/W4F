<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>W4F</title>
    <!-- A <link> (not a CSS @import) — loads in parallel with the
         stylesheet instead of blocking on it, and avoids lightningcss's
         @import-ordering warning when bundling index.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Heading/body split per language, picked via the ui-ux-pro-max
         skill's "Corporate Trust" (Lexend/Source Sans 3, government/
         enterprise) pairing for French and its Arabic equivalent (Noto
         Kufi Arabic/Noto Sans Arabic — a geometric display face over
         Arabic's own text face gives real heading hierarchy instead of
         one weight doing all the work). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=Lexend:wght@500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
