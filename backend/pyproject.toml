[project]
name = "w4f-backend"
version = "0.1.0"
description = "W4F — government backend API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "boto3>=1.35",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "requests>=2.32",
    "ruff>=0.7",
    "mypy>=1.13",
    # Mock S3-compatible server for testing media upload flows against a
    # real boto3-speaking HTTP endpoint without Docker/MinIO — see
    # PROGRESS.md for why (MinIO's winget package has a broken upstream
    # manifest, and Docker can't run on this dev machine at all).
    # Production still targets real MinIO via docker-compose.yml.
    "moto[server]>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...)-as-a-default-argument is the documented,
# idiomatic pattern (Depends is immutable and evaluated once by FastAPI's
# DI system) — the mutable-default-argument risk this rule guards against
# doesn't apply here.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
